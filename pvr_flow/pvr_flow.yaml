summary: ""
description: ""
value:
  modules:
    - id: validated_message
      value:
        type: script
        path: u/admin/parse_alert
        input_transforms:
          dry_run:
            type: static
            value: false
          payload:
            expr: flow_input
            type: javascript
        is_trigger: false

      summary: Validatior
    - id: b
      value:
        type: branchone
        default:
          - id: info_classify
            value:
              lock: |
                # py: 3.12
              type: rawscript
              content: >-
                # import wmill

                from typing import Any


                def main(validated_json: dict[str, Any]):
                    severity = validated_json.get("severity")
                    match severity:
                        case "critical":
                            return {**validated_json, "should_page": True, "channel": "#incidents"}
                        case "warning":
                            return {**validated_json, "should_page": False, "channel": "#alerts"}
                        case _:
                            return {**validated_json, "should_page": False, "channel": "#monitoring"}
              language: python3
              input_transforms:
                validated_json:
                  expr: results.validated_message
                  type: javascript
            summary: Classify
          - id: c22
            value:
              path: u/admin/slack_call
              type: script
              is_trigger: false
              input_transforms:
                in_CI:
                  type: static
                  value: false
                dry_run:
                  expr: results.validated_message.dry_run
                  type: javascript
                in_data:
                  expr: previous_result
                  type: javascript
                should_fail:
                  type: static
                  value: false
            summary: Slack Call
        branches:
          - expr: results.validated_message.valid === false
            modules:
              - id: dlq_log
                value:
                  lock: |
                    # py: 3.12
                  type: rawscript
                  content: >-
                    import logging

                    def main(invalid_payload: dict):
                        logger = logging.getLogger(__name__)
                        logger.error(f"Routing to DLQ: {invalid_payload}")
                        return {"status": "routed_to_dlq", "data": invalid_payload}
                  language: python3
                  input_transforms:
                    invalid_payload:
                      expr: results.validated_message
                      type: javascript
                summary: Send to DLQ
            summary: DLQ Branch
            parallel: true
            skip_failure: true
          - expr: results.validated_message.severity == "warning"
            modules:
              - id: warning_classify
                value:
                  lock: |
                    # py: 3.12
                  type: rawscript
                  content: >-
                    # import wmill

                    from typing import Any


                    def main(validated_json: dict[str, Any]):
                        severity = validated_json.get("severity")
                        match severity:
                            case "critical":
                                return {**validated_json, "should_page": True, "channel": "#incidents"}
                            case "warning":
                                return {**validated_json, "should_page": False, "channel": "#alerts"}
                            case "critical":
                                return {**validated_json, "should_page": False, "channel": "#monitoring"}
                            case _:
                                raise ValueError("Severity was not as expected")
                  language: python3
                  input_transforms:
                    validated_json:
                      expr: results.validated_message
                      type: javascript
                summary: Classify
              - id: c2
                value:
                  path: u/admin/slack_call
                  type: script
                  is_trigger: false
                  input_transforms:
                    in_CI:
                      type: static
                      value: false
                    dry_run:
                      expr: results.validated_message.dry_run
                      type: javascript
                    in_data:
                      expr: previous_result
                      type: javascript
                    should_fail:
                      type: static
                      value: false
                summary: Slack Call
            summary: Warning Branch
            parallel: true
            skip_failure: true
          - expr: results.validated_message.severity == "critical"
            modules:
              - id: error_classify
                value:
                  lock: |
                    # py: 3.12
                  type: rawscript
                  content: >-
                    # import wmill

                    from typing import Any


                    def main(validated_json: dict[str, Any]):
                        severity = validated_json.get("severity")
                        match severity:
                            case "critical":
                                return {**validated_json, "should_page": True, "channel": "#incidents"}
                            case "warning":
                                return {**validated_json, "should_page": False, "channel": "#alerts"}
                            case "critical":
                                return {**validated_json, "should_page": False, "channel": "#monitoring"}
                            case _:
                                raise ValueError("Severity was not as expected")
                  language: python3
                  input_transforms:
                    validated_json:
                      expr: results.validated_message
                      type: javascript
                summary: Classify
              - id: c
                value:
                  path: u/admin/slack_call
                  type: script
                  is_trigger: false
                  input_transforms:
                    in_CI:
                      type: static
                      value: false
                    dry_run:
                      expr: results.error_classify.dry_run
                      type: javascript
                    in_data:
                      expr: previous_result
                      type: javascript
                    should_fail:
                      type: static
                      value: false
                summary: Slack Call
            summary: Error Branch
            parallel: true
            skip_failure: true
      summary: ""
  groups: []
schema:
  order:
    - alert_id
    - service
    - severity
    - message
    - host
    - triggered_at
  properties:
    alert_id:
      type: string
      description: ""
      default: ""
    service:
      type: string
      description: ""
      default: ""
    severity:
      default: ""
      type: string
      description: ""
    message:
      type: string
      description: ""
      default: ""
    host:
      type: string
      description: ""
      default: ""
    triggered_at:
      type: integer
      description: ""
  required: []
